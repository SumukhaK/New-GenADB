<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="bt">
  <title id="bt">Setu (Setu-SDK): an encrypted bridge between your IDE and any Android device, anywhere</title>
  <defs>
    <linearGradient id="blink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="320" rx="24"/></clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1E293B"/>
    </pattern>
    <linearGradient id="blinkh" gradientUnits="userSpaceOnUse" x1="44" y1="0" x2="82" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="#0F172A"/>
  <rect width="1280" height="320" rx="24" fill="url(#dots)"/>
  <rect x="0" y="312" width="1280" height="8" fill="url(#blink)" clip-path="url(#card)"/>
  <g transform="translate(96 64) scale(1.5)">
  <rect width="128" height="128" rx="28" fill="#0F172A"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#1E293B" stroke-width="2"/>
  <!-- setu: a suspension bridge between device and terminal -->
  <path d="M26 42 C 42 16, 86 16, 102 42" fill="none" stroke="url(#blink)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="48" y1="25.1" x2="48" y2="72" stroke="url(#blinkh)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="64" y1="22.5" x2="64" y2="57" stroke="url(#blinkh)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="80" y1="25.1" x2="80" y2="72" stroke="url(#blinkh)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <!-- Android device -->
  <rect x="12" y="40" width="28" height="54" rx="7" fill="#0F172A" stroke="#10B981" stroke-width="4"/>
  <line x1="22" y1="47" x2="30" y2="47" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  <circle cx="26" cy="85" r="2.5" fill="#10B981"/>
  <!-- developer terminal -->
  <rect x="84" y="46" width="34" height="42" rx="6" fill="#0F172A" stroke="#3B82F6" stroke-width="4"/>
  <line x1="84" y1="56" x2="118" y2="56" stroke="#3B82F6" stroke-width="3"/>
  <polyline points="91,65 97,70 91,75" fill="none" stroke="#3B82F6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="100" y1="77" x2="110" y2="77" stroke="#3B82F6" stroke-width="3.5" stroke-linecap="round"/>
  <!-- encrypted link -->
  <line x1="44" y1="74" x2="82" y2="74" stroke="url(#blinkh)" stroke-width="4" stroke-linecap="round"/>
  <rect x="55" y="65" width="18" height="15" rx="3.5" fill="#10B981" stroke="#0F172A" stroke-width="2.5"/>
  <path d="M58.5 65 v-4 a5.5 5.5 0 0 1 11 0 v4" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="72" r="2" fill="#0F172A"/>
</g>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="344" y="146" font-size="76" font-weight="700" fill="#F8FAFC" letter-spacing="-1">Setu<tspan font-size="40" font-weight="600" fill="#10B981" dx="4">-SDK</tspan></text>
    <text x="348" y="196" font-size="24" fill="#CBD5E1">An encrypted bridge between your IDE and any Android device, anywhere.</text>
    <text x="348" y="234" font-size="22" fill="#94A3B8">End-to-end encrypted ADB across carrier NAT and corporate firewalls</text>
  </g>
</svg>
